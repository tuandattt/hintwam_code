# LIBERO-90: the 90 tasks the released Fast-WAM LIBERO checkpoint never saw.
#
# That checkpoint was post-trained on spatial / object / goal / 10, so those
# suites are saturated -- post-training there has nothing left to find, which is
# what the RoboTwin arm demonstrated. LIBERO-90 shares the embodiment, the
# action space and the format, and is unseen, so it is the setting on-policy
# self-distillation was designed for: a competent model, a new dataset with
# ground-truth trajectories, and a short budget.
#
# 3921 episodes, 569k frames, 20 fps. Unlike `libero_2cam`, this config carries
# a val split: without one, none of the paired evaluations can run.
train:
  # <1.0 keeps only that share of TRAIN episodes (low-data regime); val is untouched.
  train_episode_fraction: 1.0
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/libero/libero_90_no_noops_lerobot
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 256, 256]
        shape: [3, 224, 224]
      - key: wrist_image
        raw_shape: [3, 256, 256]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 7
        shape: 7
    state:
      - key: default
        raw_shape: 8
        shape: 8
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.1
  is_training_set: true
  # The released checkpoint's own statistics. Re-deriving them from LIBERO-90
  # would shift the normalization out from under a model trained with these,
  # and every arm starts from that checkpoint.
  pretrained_norm_stats: ./checkpoints/fastwam_release/libero_uncond_2cam224_dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: "horizontal"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 7 # eef_pose (6) + gripper (1)
    proprio_output_dim: 8 # eef_pose (6) + gripper (2)
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]
    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ./data/text_embeds_cache/libero90
  context_len: 128
val:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ./data/libero/libero_90_no_noops_lerobot
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 256, 256]
        shape: [3, 224, 224]
      - key: wrist_image
        raw_shape: [3, 256, 256]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 7
        shape: 7
    state:
      - key: default
        raw_shape: 8
        shape: 8
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.1
  is_training_set: false
  # The released checkpoint's own statistics. Re-deriving them from LIBERO-90
  # would shift the normalization out from under a model trained with these,
  # and every arm starts from that checkpoint.
  pretrained_norm_stats: ./checkpoints/fastwam_release/libero_uncond_2cam224_dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: "horizontal"
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 7 # eef_pose (6) + gripper (1)
    proprio_output_dim: 8 # eef_pose (6) + gripper (2)
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]
    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ./data/text_embeds_cache/libero90
  context_len: 128
