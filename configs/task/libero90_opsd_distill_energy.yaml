# @package _global_
#
# Stage B, HINT-WAM on LIBERO-90: the student samples M = 4 action chunks with its own
# sampler; the energy score matches them to the hindsight teacher's action, plus the BC anchor.
# Effective batch 192 = batch 4 x 8 GPUs x accumulation 6.
#
#   bash scripts/train_zero2.sh 8 task=libero90_opsd_distill_energy #     resume=<SFT step_003000.pt> opsd.teacher_ckpt=<Stage A step_002000.pt>
#
# The first log lines must show "teacher loaded from <path>: N adapter + M provider tensors".
# Objective ablations: opsd.loss_type=action_mse; opsd.state_source=demo (off-policy states);
# opsd.energy_samples=M; opsd.lambda_bc=0 (no anchor).

defaults:
  - override /data: libero90
  - override /model: fastwam
  - _self_

batch_size: 4
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  # Every arm starts from the released LIBERO checkpoint, passed as `resume`;
  # loading the generic ActionDiT backbone first would overwrite it.
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

opsd:
  enabled: true
  mode: distill
  phi_provider: future_latent
  phi_dim: 512
  phi_tokens: 8
  adapter_layers: [4, 9, 14, 19, 24, 29]
  adapter_bottleneck: 512
  alpha_init: 1.0
  zero_init_up: true
  action_loss_only: true
  teacher_ckpt: null
  loss_type: energy
  energy_samples: 4
  lambda_flow: 1.0
  lambda_bc: 1.0
  distill_inference_steps: 10
  num_sigma_points: 1
  loss_weighting: uniform
  # student = on-policy states from the student's own sampler (HINT-WAM);
  # demo = the demonstration's action noised to the same sigma points (off-policy ablation)
  state_source: student

frozen_experts: [video]
save_trainable_only: false
save_training_state: false

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 100
max_steps: 2000
log_every: 10
save_every: 500
eval_every: 1000

gradient_accumulation_steps: 6
weight_decay: 1e-2
resume: null
