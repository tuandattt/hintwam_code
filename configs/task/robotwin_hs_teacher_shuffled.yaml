# @package _global_
#
# RoboTwin Stage A CONTROL: identical to robotwin_hs_teacher, but the future latents
# are rotated across the batch, so the teacher sees a real future that is not its own.
# Distilling from it isolates "hindsight helps" from "self-distillation helps".
#
#   bash scripts/train_zero2.sh 8 task=robotwin_hs_teacher_shuffled resume=$BASE_R
#
# Needs a per-device batch of at least 2.

defaults:
  - override /data: robotwin
  - override /model: fastwam
  - _self_

batch_size: 8
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

opsd:
  enabled: true
  mode: teacher
  phi_provider: future_latent
  phi_dim: 512
  phi_tokens: 8
  adapter_layers: [4, 9, 14, 19, 24, 29]
  adapter_bottleneck: 512
  alpha_init: 1.0
  zero_init_up: true
  action_loss_only: true
  shuffle_c: true

frozen_experts: [video, action]
save_trainable_only: true
save_training_state: false

lr_scheduler_type: "cosine"
learning_rate: 3e-4
num_epochs: 100
max_steps: 2000
log_every: 10
save_every: 250
eval_every: 250

gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
