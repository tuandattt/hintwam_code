# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
# tqdm bar on rank 0. Set false for non-TTY logs (nohup, slurm) to keep them clean.
progress_bar: true
# Save only parameters that require grad. Essential for OPSD Stage A, where
# ~13 M of 6.02 B move: ~26 MB per checkpoint instead of ~11.6 GB.
save_trainable_only: false
# Full DeepSpeed model+optimizer state (~20 GB per save here). Needed ONLY to
# resume a run mid-flight; eval and Stage B read the weights .pt instead.
save_training_state: true
save_every: 100
eval_every: 50
eval_num_inference_steps: 10

# training
# MoT experts kept frozen. ["video"] is required on 24-25 GB GPUs.
frozen_experts: []
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
